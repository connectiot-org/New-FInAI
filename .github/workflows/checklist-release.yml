name: Checklist release checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checklist-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend tooling
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Repository layout and import boundaries
        run: |
          npm --prefix frontend run test:repository
          npm --prefix frontend run check:repository

  backend:
    name: Backend matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Local database and backend checks
        working-directory: backend
        run: |
          npm run db:init
          npm run db:up
          npm run generate
          npm run db:migrate
          npm run db:seed
          npm run typecheck
          npm run lint
          npm run build
          npm test
          npm audit
      - name: Stop CI database
        if: always()
        working-directory: backend
        run: docker compose stop db

  contracts:
    name: Contract validators
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend validator dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Contract checks
        run: |
          python3 -m venv /tmp/finai-contracts
          /tmp/finai-contracts/bin/pip install -r contracts/requirements.txt
          /tmp/finai-contracts/bin/python contracts/validate_examples.py
          /tmp/finai-contracts/bin/python contracts/validate_subscriptions.py
          /tmp/finai-contracts/bin/python contracts/validate_receivables.py
          /tmp/finai-contracts/bin/python contracts/validate_receivables_detail.py
          node contracts/validate_assistant.mjs
          node contracts/validate_public_chat.mjs
          node contracts/validate_payables.mjs
          npm exec --yes --package @redocly/cli@2.8.0 -- redocly lint contracts/openapi.yaml contracts/subscriptions.openapi.yaml contracts/receivables.openapi.yaml contracts/receivables-detail.openapi.yaml contracts/workspace.openapi.yaml contracts/assistant.openapi.yaml contracts/payables.openapi.json --extends minimal

  frontend:
    name: Frontend static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install frontend and backend type dependencies
        # tests/vercel-backend.spec.ts imports backend node_modules types
        # during the frontend typecheck, so both installs are required.
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Typecheck, lint and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit

  browser-demo:
    name: Browser suites without database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Demo browser tests
        working-directory: frontend
        run: npm run test
      - name: Standalone invoice demo without database or sign-in
        working-directory: frontend
        run: npm run test:invoice-demo
      - name: Supplier invoice UI tests
        working-directory: frontend
        run: npm run test:payables
      - name: Receivables browser tests
        working-directory: frontend
        run: npm run test:receivables
      - name: Workspace browser tests
        working-directory: frontend
        run: npm run test:workspace
      - name: Assistant browser tests
        working-directory: frontend
        run: npm run test:assistant
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-demo-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  browser-integration:
    name: Browser suites with database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install separate application dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Local database, migrations, seed and backend build
        working-directory: backend
        run: |
          npm run db:init
          npm run db:up
          npm run generate
          npm run db:migrate
          npm run db:seed
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Checklist integration tests
        working-directory: frontend
        run: npm run test:checklist
      - name: Subscription integration tests
        working-directory: frontend
        run: npm run test:subscriptions
      - name: Built session integration tests
        working-directory: frontend
        run: npm run test:session
      - name: Built receivables integration tests
        working-directory: frontend
        run: npm run test:receivables:production
      - name: Built workspace integration tests
        working-directory: frontend
        run: npm run test:workspace:production
      - name: Built Assistant integration tests
        working-directory: frontend
        run: npm run test:assistant:production
      - name: Public free-model chat integration tests
        # Needs no database, but runs here so the public-chat build output
        # exists for the asset scan over all seven build roots below.
        working-directory: frontend
        run: npm run test:public-chat
      - name: Same-project Vercel backend integration tests
        working-directory: frontend
        run: npm run test:vercel
      - name: Supplier invoice transport tests
        working-directory: frontend
        run: npm run test:payables-transport
      - name: Built supplier invoice integration tests
        working-directory: frontend
        run: npm run test:payables:integration
      - name: Frontend asset scan across all seven builds
        # Runs in this job because build:vercel rebuilds dist here and the
        # public-chat/session/receivables/workspace/assistant/payables
        # builds all exist in this job; the same scan ran at the end of the
        # monolithic verify job before the split.
        working-directory: frontend
        run: node scripts/check-assets.ts
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-failure-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop CI database
        if: always()
        working-directory: backend
        run: docker compose stop db

  container:
    name: Container build and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Local database and generated client for rehearsal
        working-directory: backend
        run: |
          npm run db:init
          npm run db:up
          npm run generate
          npm run build
      - name: Container build and synthetic application restore
        run: |
          docker build -t finai-backend:ci backend
          bash backend/scripts/restore-rehearsal.sh
      - name: Stop CI database
        if: always()
        working-directory: backend
        run: docker compose stop db
