name: FinAI product release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install separate application dependencies
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Local database and backend checks
        working-directory: backend
        run: |
          npm run db:init
          npm run db:up
          npm run generate
          npm run db:migrate
          npm run db:seed
          npm run typecheck
          npm run lint
          npm run build
          npm test
          npm audit
      - name: Contract checks
        run: |
          python3 -m venv /tmp/finai-contracts
          /tmp/finai-contracts/bin/pip install -r contracts/requirements.txt
          /tmp/finai-contracts/bin/python contracts/validate_examples.py
          /tmp/finai-contracts/bin/python contracts/validate_subscriptions.py
          /tmp/finai-contracts/bin/python contracts/validate_payment_due_date.py
          /tmp/finai-contracts/bin/python contracts/validate_openrouter.py
          npm exec --yes --package @redocly/cli@2.8.0 -- redocly lint contracts/openapi.yaml contracts/subscriptions.openapi.yaml contracts/payment-due-date.openapi.yaml contracts/openrouter.openapi.yaml --extends minimal
      - name: Browser and production session checks
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run lint
          npm run build
          npm test
          npm run test:checklist
          npm run test:subscriptions
          npm run test:payment-due-date
          npm run test:session
          npm run test:proxy
          npm run check:product
          npm audit
      - name: Container build and synthetic application restore
        run: |
          docker build -t finai-backend:ci backend
          bash backend/scripts/restore-rehearsal.sh
      - name: Stop CI database
        if: always()
        working-directory: backend
        run: docker compose stop db
