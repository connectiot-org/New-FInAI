components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-finai_session
  schemas:
    Source:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - version
      - sourceName
      - sourceCapturedAt
      - importedAt
      properties:
        snapshotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        sourceName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001f\u007f]+$
        sourceCapturedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\u0000-\u001f\u007f]+$
        message:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\u0000-\u001f\u007f]+$
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Filters:
      type: object
      additionalProperties: false
      required:
      - status
      - customerId
      - search
      properties:
        status: *id005
        customerId:
          anyOf:
          - *id006
          - type: 'null'
        search:
          type: string
          maxLength: 100
    Invoice:
      type: object
      additionalProperties: false
      required:
      - invoiceId
      - customerId
      - customerName
      - issuedOn
      - status
      - amountCents
      - paidCents
      - remainingCents
      properties:
        invoiceId: *id006
        customerId: *id006
        customerName:
          anyOf:
          - *id006
          - type: 'null'
        issuedOn:
          type: string
          format: date
        status:
          enum:
          - Draft
          - Issued
          - Partial
          - Paid
        amountCents: &id010
          type: integer
          minimum: 0
          maximum: 9007199254740991
        paidCents: *id010
        remainingCents: *id010
    Customer:
      type: object
      additionalProperties: false
      required:
      - customerId
      - customerName
      - invoiceCount
      - remainingCents
      properties:
        customerId: *id006
        customerName:
          anyOf:
          - *id006
          - type: 'null'
        invoiceCount:
          type: integer
          minimum: 1
          maximum: 10000
        remainingCents: *id010
    IssuePeriod:
      type: object
      additionalProperties: false
      required:
      - period
      - invoiceCount
      - customerCount
      - remainingCents
      properties:
        period: *id004
        invoiceCount:
          type: integer
          minimum: 1
          maximum: 10000
        customerCount:
          type: integer
          minimum: 1
          maximum: 10000
        remainingCents: *id010
    Invoices:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: invoice
        entityId: *id003
        period: *id004
        currency: &id011
          const: USD
        source: &id012
          $ref: '#/components/schemas/Source'
        filters: &id013
          $ref: '#/components/schemas/Filters'
        offset: *id002
        limit: &id014
          type: integer
          minimum: 1
          maximum: 10000
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: &id015
          anyOf:
          - *id002
          - type: 'null'
        sort:
          const: invoiceId:asc
        items:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Invoice'
    Customers:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: customer
        entityId: *id003
        period: *id004
        currency: *id011
        source: *id012
        filters: *id013
        offset: *id002
        limit: *id014
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: *id015
        sort:
          const: remainingCents:desc,customerId:asc
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Customer'
    IssuePeriods:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: issue-period
        entityId: *id003
        period: *id004
        currency: *id011
        source: *id012
        filters: *id013
        offset: *id002
        limit: *id014
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: *id015
        sort:
          const: period:asc
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/IssuePeriod'
    Snapshots:
      type: object
      additionalProperties: false
      required:
      - entityId
      - offset
      - limit
      - total
      - nextOffset
      - items
      properties:
        entityId: *id003
        offset: *id002
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        nextOffset:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        items:
          type: array
          maxItems: 50
          items:
            allOf:
            - $ref: '#/components/schemas/HistorySource'
    HistorySource:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - version
      - sourceName
      - sourceCapturedAt
      - importedAt
      - importingActorId
      - digest
      properties:
        snapshotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        sourceName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001f\u007f]+$
        sourceCapturedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importingActorId:
          type: string
          format: uuid
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
