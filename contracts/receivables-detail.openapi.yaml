          type: integer
          minimum: 1
          maximum: 50
      - name: snapshotId
        in: query
        required: true
        schema: *id003
      - name: period
        in: query
        required: true
        schema: &id004
          type: string
          pattern: ^(all|(?!0000)\d{4}-(0[1-9]|1[0-2]))$
      - name: status
        in: query
        schema: &id005
          enum:
          - all
          - outstanding
          - Draft
          - Issued
          - Partial
          - Paid
      - name: customerId
        in: query
        schema: &id006
          type: string
          minLength: 1
          maxLength: 200
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Authorized immutable snapshot result; stable deterministic
            bounded pagination. Export permits authorized read members, max 10000
            rows, JSON through existing proxy; browser CSV is a deliberate action
            with exact minor-unit conversion and formula escaping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices'
              example:
                entityId: 22222222-2222-4222-8222-222222222222
                period: all
                currency: USD
                source: &id007
                  snapshotId: 33333333-3333-4333-8333-333333333333
                  version: 1
                  sourceName: Owner-approved export
                  sourceCapturedAt: '2026-10-23T00:00:00Z'
                  importedAt: '2026-10-24T00:00:00Z'
                filters: &id008
                  status: outstanding
                  customerId: null
                  search: ''
                offset: 0
                limit: 20
                total: 1
                invoiceCount: 1
                customerCount: 1
                remainingCents: 75000
                nextOffset: null
                view: invoice
                sort: invoiceId:asc
                items: &id009
                - invoiceId: source-invoice-1
                  customerId: source-customer-1
                  customerName: Synthetic customer
                  issuedOn: '2026-09-01'
                  status: Partial
                  amountCents: 100000
                  paidCents: 25000
                  remainingCents: 75000
        '401':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Safe JSON error, no foreign existence disclosure
