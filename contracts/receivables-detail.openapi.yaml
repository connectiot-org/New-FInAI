  /api/v1/receivables/changes:
    get:
      operationId: receivableChanges
      summary: Compare two saved invoice imports
      description: Read permission only. No financial write or model call. Exact invoice
        IDs, all statuses and issue dates; earlier/later use imported versions. Identical
        sources are valid; reversed versions rejected only after both sources are authorized.
        Money is canonical integer strings. C collation invoice ordering. Unknown and
        repeated query values are rejected.
      security:
      - Session: []
      parameters:
      - name: entityId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: fromSnapshotId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: toSnapshotId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 20000
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: All-issue-date exact comparison of two authorized pinned sources.
            Totals and bridge cover the full union before changed-only pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
              example:
                entityId: 22222222-2222-4222-8222-222222222222
                currency: USD
                basis: all_issue_dates_cumulative_paid
                fromSource:
                  snapshotId: 33333333-3333-4333-8333-333333333333
                  version: 1
                  sourceName: Synthetic register 1
                  sourceCapturedAt: '2026-10-21T00:00:00Z'
                  importedAt: '2026-10-24T00:00:00Z'
                toSource:
                  snapshotId: 44444444-4444-4444-8444-444444444444
                  version: 2
                  sourceName: Synthetic register 2
                  sourceCapturedAt: '2026-10-22T00:00:00Z'
                  importedAt: '2026-10-24T00:00:00Z'
                earlierOutstandingCents: '255000'
                laterOutstandingCents: '215000'
                deltaCents: '-40000'
                changedInvoiceCount: 1
                unionInvoiceCount: 5
                bridge:
                  newInLaterCents: '0'
                  absentFromLaterCents: '0'
                  increasedCents: '0'
                  decreasedCents: '-40000'
                sourceCutoffReversed: false
                offset: 0
                limit: 20
                nextOffset: null
                sort: invoiceId:asc
                items:
                - invoiceId: INV-001
                  earlier:
                    customerId: C-1
                    customerName: Synthetic customer
                    issuedOn: '2026-09-01'
                    status: Issued
                    amountCents: '100000'
                    paidCents: '0'
                  later:
                    customerId: C-1
                    customerName: Synthetic customer
                    issuedOn: '2026-09-01'
                    status: Partial
                    amountCents: '100000'
                    paidCents: '40000'
                  changedFields:
                  - status
                  - paidCents
                  flags:
                  - outstanding_decreased
                  earlierOutstandingCents: '100000'
                  laterOutstandingCents: '60000'
                  deltaCents: '-40000'
        '401':
          description: Safe error without source disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Safe error without source disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Safe error without source disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Safe error without source disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Safe error without source disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-finai_session
  schemas:
    Source:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - version
      - sourceName
      - sourceCapturedAt
      - importedAt
      properties:
        snapshotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        sourceName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001f\u007f]+$
        sourceCapturedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\u0000-\u001f\u007f]+$
        message:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^[^\u0000-\u001f\u007f]+$
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Filters:
      type: object
      additionalProperties: false
      required:
      - status
      - customerId
      - search
      properties:
        status: *id005
        customerId:
          anyOf:
          - *id006
          - type: 'null'
        search:
          type: string
          maxLength: 100
    Invoice:
      type: object
      additionalProperties: false
      required:
      - invoiceId
      - customerId
      - customerName
      - issuedOn
      - status
      - amountCents
      - paidCents
      - remainingCents
      properties:
        invoiceId: *id006
        customerId: *id006
        customerName:
          anyOf:
          - *id006
          - type: 'null'
        issuedOn:
          type: string
          format: date
        status:
          enum:
          - Draft
          - Issued
          - Partial
          - Paid
        amountCents: &id010
          type: integer
          minimum: 0
          maximum: 9007199254740991
        paidCents: *id010
        remainingCents: *id010
    Customer:
      type: object
      additionalProperties: false
      required:
      - customerId
      - customerName
      - invoiceCount
      - remainingCents
      properties:
        customerId: *id006
        customerName:
          anyOf:
          - *id006
          - type: 'null'
        invoiceCount:
          type: integer
          minimum: 1
          maximum: 10000
        remainingCents: *id010
    IssuePeriod:
      type: object
      additionalProperties: false
      required:
      - period
      - invoiceCount
      - customerCount
      - remainingCents
      properties:
        period: *id004
        invoiceCount:
          type: integer
          minimum: 1
          maximum: 10000
        customerCount:
          type: integer
          minimum: 1
          maximum: 10000
        remainingCents: *id010
    Invoices:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: invoice
        entityId: *id003
        period: *id004
        currency: &id011
          const: USD
        source: &id012
          $ref: '#/components/schemas/Source'
        filters: &id013
          $ref: '#/components/schemas/Filters'
        offset: *id002
        limit: &id014
          type: integer
          minimum: 1
          maximum: 10000
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: &id015
          anyOf:
          - *id002
          - type: 'null'
        sort:
          const: invoiceId:asc
        items:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/Invoice'
    Customers:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: customer
        entityId: *id003
        period: *id004
        currency: *id011
        source: *id012
        filters: *id013
        offset: *id002
        limit: *id014
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: *id015
        sort:
          const: remainingCents:desc,customerId:asc
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Customer'
    IssuePeriods:
      type: object
      additionalProperties: false
      required:
      - view
      - entityId
      - period
      - currency
      - source
      - filters
      - offset
      - limit
      - total
      - invoiceCount
      - customerCount
      - remainingCents
      - nextOffset
      - sort
      - items
      properties:
        view:
          const: issue-period
        entityId: *id003
        period: *id004
        currency: *id011
        source: *id012
        filters: *id013
        offset: *id002
        limit: *id014
        total: *id002
        invoiceCount: *id002
        customerCount: *id002
        remainingCents: *id010
        nextOffset: *id015
        sort:
          const: period:asc
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/IssuePeriod'
    Snapshots:
      type: object
      additionalProperties: false
      required:
      - entityId
      - offset
      - limit
      - total
      - nextOffset
      - items
      properties:
        entityId: *id003
        offset: *id002
        limit:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        nextOffset:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        items:
          type: array
          maxItems: 50
          items:
            allOf:
            - $ref: '#/components/schemas/HistorySource'
    HistorySource:
      type: object
      additionalProperties: false
      required:
      - snapshotId
      - version
      - sourceName
      - sourceCapturedAt
      - importedAt
      - importingActorId
      - digest
      properties:
        snapshotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        sourceName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[^\u0000-\u001f\u007f]+$
        sourceCapturedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importedAt:
          type: string
          format: date-time
          pattern: ^\d{4}-.*Z$
        importingActorId:
          type: string
          format: uuid
        digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ChangeUnsignedCents:
      type: string
      pattern: ^(0|[1-9][0-9]{0,19})$
      maxLength: 20
    ChangeSignedCents:
      type: string
      pattern: ^(0|-?[1-9][0-9]{0,19})$
      maxLength: 21
    ChangeRecord:
      type: object
      additionalProperties: false
      required:
      - customerId
      - customerName
      - issuedOn
      - status
      - amountCents
      - paidCents
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 200
        customerName:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        issuedOn:
          type: string
          format: date
        status:
          enum:
          - Draft
          - Issued
          - Partial
          - Paid
        amountCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
        paidCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
    ChangeItem:
      type: object
      additionalProperties: false
      required:
      - invoiceId
      - earlier
      - later
      - changedFields
      - flags
      - earlierOutstandingCents
      - laterOutstandingCents
      - deltaCents
      properties:
        invoiceId:
          type: string
          minLength: 1
          maxLength: 200
        earlier:
          anyOf:
          - $ref: '#/components/schemas/ChangeRecord'
          - type: 'null'
        later:
          anyOf:
          - $ref: '#/components/schemas/ChangeRecord'
          - type: 'null'
        changedFields:
          type: array
          uniqueItems: true
          maxItems: 6
          items:
            enum:
            - customerId
            - customerName
            - issuedOn
            - status
            - amountCents
            - paidCents
        flags:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            enum:
            - new_in_later
            - absent_from_later
            - outstanding_increased
            - outstanding_decreased
        earlierOutstandingCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
        laterOutstandingCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
        deltaCents:
          $ref: '#/components/schemas/ChangeSignedCents'
    ChangeBridge:
      type: object
      additionalProperties: false
      required:
      - newInLaterCents
      - absentFromLaterCents
      - increasedCents
      - decreasedCents
      properties:
        newInLaterCents:
          $ref: '#/components/schemas/ChangeSignedCents'
        absentFromLaterCents:
          $ref: '#/components/schemas/ChangeSignedCents'
        increasedCents:
          $ref: '#/components/schemas/ChangeSignedCents'
        decreasedCents:
          $ref: '#/components/schemas/ChangeSignedCents'
    Changes:
      type: object
      additionalProperties: false
      required:
      - entityId
      - currency
      - basis
      - fromSource
      - toSource
      - earlierOutstandingCents
      - laterOutstandingCents
      - deltaCents
      - changedInvoiceCount
      - unionInvoiceCount
      - bridge
      - sourceCutoffReversed
      - offset
      - limit
      - nextOffset
      - sort
      - items
      properties:
        entityId:
          type: string
          format: uuid
        currency:
          const: USD
        basis:
          const: all_issue_dates_cumulative_paid
        fromSource:
          $ref: '#/components/schemas/Source'
        toSource:
          $ref: '#/components/schemas/Source'
        earlierOutstandingCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
        laterOutstandingCents:
          $ref: '#/components/schemas/ChangeUnsignedCents'
        deltaCents:
          $ref: '#/components/schemas/ChangeSignedCents'
        changedInvoiceCount:
          type: integer
          minimum: 0
          maximum: 20000
        unionInvoiceCount:
          type: integer
          minimum: 0
          maximum: 20000
        bridge:
          $ref: '#/components/schemas/ChangeBridge'
        sourceCutoffReversed:
          type: boolean
        offset:
          type: integer
          minimum: 0
          maximum: 20000
        limit:
          type: integer
          minimum: 1
          maximum: 50
        nextOffset:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 20000
          - type: 'null'
        sort:
          const: invoiceId:asc
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ChangeItem'
