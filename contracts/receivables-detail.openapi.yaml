          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoices'
              example:
                entityId: 22222222-2222-4222-8222-222222222222
                period: all
                currency: USD
                source: *id007
                filters: *id008
                offset: 0
                limit: 10000
                total: 1
                invoiceCount: 1
                customerCount: 1
                remainingCents: 75000
                nextOffset: null
                view: invoice
