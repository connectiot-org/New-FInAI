  /api/v1/receivables/export:
    get:
      operationId: receivableInvoicesExport
      security:
      - Session: []
      parameters:
      - *id001
      - name: snapshotId
        in: query
        required: true
        schema: *id003
      - name: period
        in: query
        required: true
        schema: *id004
      - name: status
        in: query
        schema: *id005
      - name: customerId
        in: query
        schema: *id006
      - name: search
        in: query
        schema:
          type: string
