openapi: 3.1.1
info:
  title: FinAI immutable receivables detail
  version: 1.2.0
  description: Additive companion to unchanged receivables 1.0.0. Every read authorizes
    entity access; explicit snapshotId pins pagination to one committed register.
    No latest mixing. Unknown/repeated query values rejected; default status outstanding,
    offset0, limit20 (max50). Source issue dates/cumulative paid values are not due-date
    aging or historical month-end data. Search is literal bounded text. Exports require
    read permission, echo filters/source, return at most10000 complete rows and never
    truncate.
servers:
- url: /
paths:
  /api/v1/receivables/snapshots:
    get:
      operationId: receivableSnapshots
      security:
      - Session: []
      parameters:
      - &id001
        name: entityId
        in: query
        required: true
        schema: &id003
          type: string
          format: uuid
      - name: offset
        in: query
        schema: &id002
          type: integer
          minimum: 0
          maximum: 10000
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Authorized immutable snapshot result; stable deterministic
            bounded pagination. Export permits authorized read members, max 10000
            rows, JSON through existing proxy; browser CSV is a deliberate action
            with exact minor-unit conversion and formula escaping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshots'
              example:
                entityId: 22222222-2222-4222-8222-222222222222
                offset: 0
                limit: 20
                total: 1
                nextOffset: null
                items:
                - snapshotId: 33333333-3333-4333-8333-333333333333
                  version: 1
                  sourceName: Owner-approved export
                  sourceCapturedAt: '2026-10-23T00:00:00Z'
                  importedAt: '2026-10-24T00:00:00Z'
                  importingActorId: 11111111-1111-4111-8111-111111111111
                  digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        '401':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Safe JSON error, no foreign existence disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: receivableSnapshots
  /api/v1/receivables/invoices:
    get:
      operationId: receivableInvoices
      security:
      - Session: []
      parameters:
      - *id001
      - name: offset
        in: query
        schema: *id002
      - name: limit
        in: query
