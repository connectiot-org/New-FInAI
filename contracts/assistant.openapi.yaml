  /api/v1/assistant/source:
    get:
      summary: Read current scoped operational source behind a dated answer
      operationId: readAssistantOperationalSource
      security:
      - Session: []
      parameters:
      - name: entityId
        in: query
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: month
        in: query
        required: true
        schema:
          type: string
          pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
      - name: kind
        in: query
        required: true
        schema:
          enum:
          - checklist
          - subscriptions
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
