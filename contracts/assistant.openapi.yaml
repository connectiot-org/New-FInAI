            records may differ from dated answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalSource'
        '401':
          description: Session invalid
        '404':
          description: Absent or inaccessible entity
        '422':
          description: Invalid source scope
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: __Host-finai_session
  schemas:
    ConversationCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - entityId
      - month
      - currency
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        month:
          type: string
          pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    TurnCreate:
      type: object
      additionalProperties: false
      required:
      - id
      - question
      - expectedVersion
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 2000
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
    PreferenceWrite:
      type: object
      additionalProperties: false
      required:
      - entityId
      - detail
      - note
      - expectedVersion
      properties:
        entityId:
          type: string
          format: uuid
        detail:
          enum:
          - concise
          - detailed
        note:
          type: string
          maxLength: 500
        expectedVersion:
          type: integer
          minimum: 0
          maximum: 2147483647
    Fact:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - value
      - unit
      - currency
      - precision
      - sourceId
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
        unit:
          enum:
          - text
          - minor
          - count
        currency:
          type:
          - string
          - 'null'
        precision:
          type: integer
          minimum: 0
          maximum: 6
        sourceId:
          type: string
        recordId:
          type: string
          maxLength: 200
        recordKind:
          enum:
          - customer
          - account
    Source:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - href
      - basis
      - capturedAt
      - importedAt
      - retrievedAt
      - version
      - snapshotId
      properties:
        id:
          type: string
        label:
          type: string
        href:
          type: string
          pattern: ^/workspace/
        basis:
          type: string
        capturedAt:
          type:
          - string
          - 'null'
          format: date-time
        importedAt:
          type:
          - string
          - 'null'
          format: date-time
        retrievedAt:
          type: string
          format: date-time
        version:
          type:
          - integer
          - 'null'
        snapshotId:
          type:
          - string
          - 'null'
          format: uuid
    Plan:
      type: object
      additionalProperties: false
      required:
      - operations
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - period
            - customerId
            - metric
            - reason
            - accountId
            properties:
              kind:
                enum:
                - receivables
                - invoices
                - checklist
                - subscriptions
                - ledger
                - clarify
                - unsupported
              period:
                enum:
                - current
                - previous
              customerId:
                type:
                - string
                - 'null'
                maxLength: 200
              metric:
                enum:
                - all
                - cash
                - revenue
                - expense
                - profit
                - receivable
                - assets
                - equity
              reason:
                enum:
                - none
                - ambiguous
                - unsupported
                - missing_ledger
                - scope_change
              accountId:
                type:
                - string
                - 'null'
                maxLength: 200
    Composition:
      type: object
      additionalProperties: false
      required:
      - factIds
      - noteIds
      properties:
        factIds:
          type: array
          maxItems: 12
          items:
            type: string
        noteIds:
          type: array
          maxItems: 8
          items:
            type: string
    Answer:
      type: object
      additionalProperties: false
      required:
      - facts
      - sources
      - notes
      - basis
      - detail
      properties:
        facts:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/Fact'
        sources:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Source'
        notes:
          type: array
          maxItems: 8
          items:
            type: string
        basis:
          type: string
        detail:
          enum:
          - concise
          - detailed
    Conversation:
      type: object
      additionalProperties: false
      required:
      - id
      - entityId
      - month
      - currency
      - version
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        month:
          type: string
          pattern: ^(?!0000)\d{4}-(0[1-9]|1[0-2])$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Turn:
      type: object
      additionalProperties: false
      required:
      - id
      - question
      - status
      - answer
      - failureCode
      - model
      - policy
      - createdAt
      - finishedAt
      properties:
        id:
          type: string
          format: uuid
        question:
          type: string
        status:
          enum:
          - pending
          - completed
          - failed
          - cancelled
        answer:
          anyOf:
          - $ref: '#/components/schemas/Answer'
          - type: 'null'
        failureCode:
          type:
          - string
          - 'null'
        model:
          type: string
        policy:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
          - string
          - 'null'
