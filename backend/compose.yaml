services:
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: finai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:init}
      POSTGRES_DB: finai
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - checklist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finai -d finai"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  checklist_pgdata:
